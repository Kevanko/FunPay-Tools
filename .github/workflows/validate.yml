name: Validate
on: [push, pull_request]
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run build:qr
      - run: npm run check
      - run: npm test
      - run: npm ci --ignore-scripts && npm run selftest
        working-directory: vps
      - run: npm run package
        env: { FPT_BUILD_DIR: '${{ runner.temp }}/packages' }
      - uses: actions/upload-artifact@v4
        with: { name: extension, path: '${{ runner.temp }}/packages/*.zip' }
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools platforms;android-35 build-tools;35.0.0' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: { name: android-apk, path: android/app/build/outputs/apk/debug/*.apk }
