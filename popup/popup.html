<!DOCTYPE html>
<html lang="ru" data-theme="graphite">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FP Tools — настройки</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="../css/phone_transfer.css">
</head>
<body>
  <div class="fpt-window" id="app">

    <!-- Titlebar -->
    <div class="fpt-titlebar">
      <div class="fpt-titlebar-l">
        <img class="fp-brand-logo" src="../icons/brand-mark.png" alt="">
        <span class="fpt-titlebar-name">FP Tools</span>
        <span class="badge badge-muted" id="version-badge">v2.8</span>
      </div>
      <div class="fpt-titlebar-r">
        <div class="fpt-status-wrap" role="status">
          <span class="fpt-sdot" id="status-dot" aria-hidden="true"></span>
          <span class="fpt-sdot-label" id="status-label">Проверка…</span>
        </div>
        <button class="btn btn-soft btn-sm" id="open-funpay-btn">
          Открыть FunPay
        </button>
        <div class="fpt-divider-v"></div>
        <a class="btn btn-quiet btn-sm btn-icon" id="telegram-btn" href="#" title="Telegram-сообщество"></a>
      </div>
    </div>

    <!-- Body: nav + content -->
    <div class="fpt-main">
      <nav class="fpt-nav fpx-scroll" id="fpt-nav">
        <div class="fpt-search" id="search-wrap">
          <span class="search-ic" id="search-icon-slot"></span>
          <input class="fpt-search-input" type="text" aria-label="Поиск по функциям" placeholder="Поиск по функциям" id="nav-search" autocomplete="off" spellcheck="false">
        </div>
        <div id="nav-groups"></div>
      </nav>
      <main class="fpt-content fpx-scroll" id="fpt-content"></main>
    </div>

  </div>
  <script src="../content/theme_core.js"></script>
  <script src="../content/ui/icons.js"></script>
  <script src="../content/settings_schema.js"></script>
  <script src="phone_transfer.bundle.js"></script>
  <script src="popup.js"></script>
</body>
</html>
